name: KEEPY staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Deploy only the KEEPY staging Worker
        run: npx wrangler@4.143.1 deploy --config .output/server/wrangler.json --name keepy-staging
        env:
          CLOUDFLARE_ACCOUNT_ID: '55a01385f7a21f377e314629ae218810'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
